version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Chisinau"
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the minimum supported Node (see engines.node), not the newest
      # release — otherwise the compiler would accept APIs missing at runtime on the
      # oldest version we support. Raise this deliberately when the floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    groups:
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "ts-node"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      runtime-minor-patch:
        patterns:
          - "@inquirer/*"
          - "dockerode"
          - "js-yaml"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Chisinau"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
