services:
  api:
    image: ghcr.io/example/api:1.2.3
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: production
      API_TOKEN: ${API_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - frontend
      - backend
  db:
    image: postgres:16.4
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    networks:
      - backend
networks:
  frontend: {}
  backend: {}
volumes:
  db-data: {}
